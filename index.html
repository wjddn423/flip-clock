iv><button class="small-btn" onclick="closeSettings();toggleMove(true)">날짜 위치 직접 조정하기</button><button class="small-btn" onclick="resetDatePositions()">날짜 위치 초기화</button><button onclick="closeSettings()">설정 완료 · 시계로 돌아가기</button><div class="note">설정은 이 기기에 저장됩니다. 글꼴은 기기에 설치된 글꼴을 사용하므로 휴대폰과 태블릿에서 모양이 조금 다를 수 있습니다. 날짜 위치는 화면 크기에 대한 비율로 저장됩니다.</div></div></div><script>
(function(){var ids=['hours','minutes','seconds'],clock=document.getElementById('clock');function half(cls){return '<div class="'+cls+'"><div class="digit">00</div></div>'}for(var i=0;i<3;i++){if(i)clock.innerHTML+='<div class="colon">:</div>';clock.innerHTML+='<div class="card" id="'+ids[i]+'">'+half('half top')+half('half bottom')+half('flap flip-top')+half('flap flip-bottom')+'<div class="seam"></div><div class="pin left"></div><div class="pin right"></div></div>'}var last={},timers={},use24=true;var font='classic',dateParts={year:false,month:false,day:false};var positions={year:{x:39,y:8},month:{x:50,y:8},day:{x:61,y:8}},moveMode=false;function savePrefs(){try{localStorage.setItem('flip_clock_v4_font',font);localStorage.setItem('flip_clock_v4_format',use24?'24':'12');localStorage.setItem('flip_clock_v5_date',JSON.stringify(dateParts));localStorage.setItem('flip_clock_v6_positions',JSON.stringify(positions))}catch(e){}}window.setFont=function(v){if(!/^(classic|slim|round|mono|serif|heavy|modern|verdana|tahoma|impact|console|times|georgia)$/.test(v))v='classic';font=v;clock.className='clock font-'+v;savePrefs()};window.setTimeFormat=function(v){use24=v!=='12';document.getElementById('ampm').className=use24?'ampm':'ampm visible';savePrefs();tick()};window.setDatePart=function(part,on){dateParts[part]=!!on;savePrefs();renderDate()};function renderDate(){var d=new Date(),values={year:d.getFullYear()+'년',month:(d.getMonth()+1)+'월',day:d.getDate()+'일'};for(var k in values){var el=document.getElementById('date'+k.charAt(0).toUpperCase()+k.slice(1));el.textContent=values[k];el.className=dateParts[k]?'date-part visible':'date-part';el.style.left=positions[k].x+'%';el.style.top=positions[k].y+'%'}var screen=document.getElementsByClassName('screen')[0];screen.className='screen'+(moveMode?' edit-dates':'')}

(function(){
